# Robolectric defaults for every suite in this module (Task-3 review carry).
# The bare Application — NOT the manifest's FausteApplication — is the
# safe default: Robolectric creates the Application once per test method
# while Koin's static GlobalContext persists across methods in the reused
# sandbox class loader, so defaulting to FausteApplication would make the
# 2nd method of any @Config-less suite crash with Koin's double-start
# exception. Suites that want a container own it explicitly (startKoin /
# stopKoin per test); the pre-existing suites keep their explicit
# @Config(application = Application::class) pins — now redundant, kept as
# drift-proofing. See LibraryScreenTest's KDoc (the @Config-less canary).
sdk=36
application=android.app.Application
