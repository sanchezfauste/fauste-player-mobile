[versions]
# Version set resolved for JDK 25 (sources and reasoning for this version
# set: commit message of 8f3af91):
# Gradle 9.x runs on Java 25 from 9.1.0; AGP 8.13 is the last line keeping the
# classic KMP module pattern; Kotlin 2.2.x is what Compose Multiplatform 1.9.x
# builds against; the compose BOM 2025.11.00 manages exactly Jetpack Compose
# 1.9.4, the Android basis of CMP 1.9.3.
agp = "8.13.2"
kotlin = "2.2.21"
compose = "1.9.3"
composeBom = "2025.11.00"
activityCompose = "1.11.0"
jna = "5.19.1"
# The committed Kotlin bindings under crates-mobile/.../bindings/kotlin were
# generated by uniffi-bindgen 0.28.x (Task 4); this pin documents their
# provenance so a future regeneration uses the matching generator.
uniffi = "0.28.0"
# Koin 4.0.0 wires the shared module's dependency injection (AppModule):
# the graph and its repositories landed with Tasks 3-4 of Phase 3.
koin = "4.0.0"
# kotlinx-coroutines 1.10.x is the release line aligned with the Kotlin 2.2.x
# stdlib (1.10.2 is its latest patch); it is the version JNA-less common code
# and the DI dispatchers compile against.
kotlinxCoroutines = "1.10.2"
# Robolectric runs Compose UI tests on the host JVM under
# :composeApp:testDebugUnitTest. CMP's own common ui-test API
# (runComposeUiTest) cannot run on an android (local) target and its
# instrumented path needs an emulator; Robolectric is the only lane that
# executes behavioural component tests in the plain Gradle battery
# (JDK 21 in CI, JDK 25 locally; Robolectric 4.17 supports both).
robolectric = "4.17"
# androidx compose-ui test artifact for the Robolectric lane. CMP 1.9.3's
# own uiTestJUnit4 accessor is desktop-only (deprecated), so the androidx
# coordinate is used directly, pinned to the exact androidx version CMP
# 1.9.3 resolves to on the android target (the 1.9.4 wave that BOM
# 2025.11.00 manages — verified against the resolved ui-android 1.9.4).
androidxComposeUiTest = "1.9.4"
# media3 1.11.1 — the current stable release line (verified against
# dl.google.com/android/maven2's media3-session maven-metadata.xml, where
# <release> and <latest> are both 1.11.1, lastUpdated 2026-09-11; androidx
# artifacts are hosted on Google Maven, not repo1.maven.org). media3 is the
# media session stack this phase's ruling names (MediaSessionCompat is
# legacy): media3-session carries MediaSessionService/MediaSession, and
# media3-common the Player surface the service adapter implements
# (SimpleBasePlayer). minSdk 21+ comfortably covers the app's 26 floor.
media3 = "1.11.1"
# androidx.lifecycle (Task 3, Ruling 3): lifecycle-runtime-compose carries
# collectAsStateWithLifecycle, the mechanism the screens' lifecycle-aware
# collection helper wraps on Android. Pinned to 2.9.4 — the exact lifecycle
# line the app already resolves transitively (activity-compose 1.11.0 →
# lifecycle-runtime 2.9.4, verified in the debugRuntimeClasspath
# resolution) — so this adds no second lifecycle version to any classpath.
lifecycle = "2.9.4"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# media3 (Task 6's MediaSession ruling): session carries MediaSessionService +
# the MediaSession the service publishes; common carries the Player contract
# the adapter implements and media3's own notification plumbing leans on.
# Declared explicitly per the task brief even though session re-exports it.
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
# The lifecycle-aware collection dependency (Task 3, Ruling 3); see the
# lifecycle version note above for the 2.9.4 pin's provenance.
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "androidxComposeUiTest" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "androidxComposeUiTest" }
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
# Koin Compose (Phase 4 plan Ruling 2; all verified against Maven Central at
# 4.0.0). The plan's hint named the group "org.jetbrains" — the actual group
# is io.insert-koin; org.jetbrains appears only in the TRANSITIVE lifecycle
# dependency (org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose,
# which on the Android target redirects to the real androidx.lifecycle
# artifacts). koin-compose carries KoinContext for the app shell;
# koin-compose-viewmodel carries koinViewModel() for the screens; the
# ViewModel DSL used below (org.koin.core.module.dsl.viewModel — its `get`
# supports qualifiers) lives in koin-core-viewmodel, which
# koin-compose-viewmodel re-exports but is declared because composeApp
# imports that DSL directly. NOTE: koin-compose-viewmodel 4.0.0 publishes NO
# -android variant (404 on Maven Central) — the Android target consumes the
# jvm variant through KGP's androidJvm->jvm platform compatibility.
koin-compose = { group = "io.insert-koin", name = "koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel", version.ref = "koin" }
koin-core-viewmodel = { group = "io.insert-koin", name = "koin-core-viewmodel", version.ref = "koin" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
