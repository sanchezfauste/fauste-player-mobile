name: Emulator

on:
  pull_request:
  push:
    branches: [main]
  # Manual re-run for first-run debugging without pushing.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Runs the fp-backends-mobile conformance / engine-smoke suite on a real
# Android emulator (API 34, google_apis, x86_64, headless, audio ON) by
# invoking scripts/emulator-test.sh — the same script used locally — so the
# CI lane and the local flow cannot drift. The script does its own guarded
# sdkmanager installs (system image + emulator package), AVD creation, boot,
# wait-for-boot, `cargo ndk -t x86_64 -P 26 test --no-run` + adb push +
# adb shell run, and trap-based emulator shutdown. All of its commands were
# proven locally (see .superpowers/sdd/2026-10-12-phase1-aaudio-backend).
#
# Runner assumptions (the only locally-unverifiable part):
#  - ubuntu-latest exposes hardware KVM (true since mid-2024); the script
#    hard-fails without /dev/kvm, so the "Enable KVM" udev step below is what
#    the android-emulator-runner action itself documents as sufficient.
#  - The preinstalled Android SDK lives at $ANDROID_HOME with cmdline-tools,
#    platform-tools and a default NDK — also true on the hosted image — plus
#    a Java (needed by sdkmanager/avdmanager); setup-java pins temurin 21 so
#    the lane does not depend on the image's default Java moving.
#  - cargo-ndk finds the runner's preinstalled default NDK via
#    $ANDROID_HOME/ndk; no extra NDK is installed by this lane.
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Path deps resolve ../fauste-player relative to this repo's checkout;
      # same as the CI and Android lanes.
      # actions/checkout@v4 refuses paths outside $GITHUB_WORKSPACE, but the
      # workspace manifests declare the desktop crates as ../fauste-player
      # (a sibling, mirroring the local layout). Check out inside the
      # workspace, then symlink it into the sibling slot the manifests expect.
      - name: Check out the desktop repo (path dependencies)
        uses: actions/checkout@v4
        with:
          repository: sanchezfauste/fauste-player
          ref: master
          path: fauste-player
      - name: Expose the desktop checkout at the sibling path the manifests expect
        run: ln -s "$GITHUB_WORKSPACE/fauste-player" "$(dirname "$GITHUB_WORKSPACE")/fauste-player"

      # Native build dependencies: the lane compiles the desktop's crates
      # for the android target, whose build scripts run on the host — the
      # same ALSA/dbus headers the CI lane installs. Cheap insurance that
      # removes a whole class of host-side build-script failures.
      - name: Native build dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libasound2-dev libdbus-1-dev

      # sdkmanager/avdmanager (invoked by scripts/emulator-test.sh) are Java
      # tools. Not needed for Gradle — this lane never touches Gradle.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Installs exactly the toolchain pinned in rust-toolchain.toml (1.98.1).
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@v2

      # Prebuilt cargo-ndk via the install-action (binary install, no
      # `cargo install` compile on every run); same source as android.yml.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # Only x86_64 is needed for the emulator lane; aarch64 stays in
      # android.yml.
      - name: Android Rust target (x86_64)
        run: rustup target add x86_64-linux-android

      # cargo-ndk (the script's build phase) needs an NDK under
      # $ANDROID_HOME/ndk — the hosted image no longer guarantees one
      # (it already dropped cmdline-tools from PATH). Install the same
      # pinned NDK the Android lane uses.
      - name: Android NDK
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null
          "$SDKMGR" "ndk;27.0.12077973"

      # KVM is present on ubuntu-latest but the udev rule is needed for the
      # runner user to get rw access (same fix android-emulator-runner
      # documents). The script checks [ -r /dev/kvm ] && [ -w /dev/kvm ].
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # The udev re-trigger does not reliably re-apply the mode to an
          # already-present node on the hosted runners (round 3: the
          # check below failed right after the trigger) — chmod is the
          # deterministic belt-and-braces.
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm

      # The whole test phase — provisioning, boot, build, push, run,
      # trap-cleanup — lives in the repo script so this YAML cannot drift
      # from the locally proven flow.
      - name: Run emulator conformance suite
        run: ./scripts/emulator-test.sh
