name: Android

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Path deps resolve ../fauste-player relative to this repo's checkout;
      # checkout@v4 accepts paths outside $GITHUB_WORKSPACE. ref rides the
      # desktop tip — pin a SHA here if CI should become flaky-coupled to
      # desktop changes.
      - name: Check out the desktop repo (path dependencies)
        uses: actions/checkout@v4
        with:
          repository: sanchezfauste/fauste-player
          ref: master
          path: ../fauste-player

      # temurin 21 — pinned on runners as the boring, cheapest, fully-supported
      # LTS for Gradle 9.3.1 / AGP 8.13.2 (Gradle 9.1+ also supports JDK 25;
      # 21 is a stability choice, not a support limit).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest has the Android SDK preinstalled but not this NDK.
      - name: Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Android Rust targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Gradle build and tests
        # :composeApp:testDebugUnitTest runs the Robolectric-based Compose
        # UI tests on the host JVM (no emulator needed) — see
        # composeApp/build.gradle.kts's androidUnitTest note.
        run: ./gradlew buildRust :fp-app-mobile-shared:test :composeApp:assembleDebug :composeApp:testDebugUnitTest

      # Bindings drift check: regenerate the Kotlin bindings into a temp dir
      # and diff against the committed files. ktlint is pinned to 1.7.1 and
      # installed BEFORE regenerating because uniffi-bindgen formats its
      # output by shelling out to `ktlint -F`; the committed bindings are the
      # formatted output, so CI must regenerate under the same tooling state
      # or it would fail on formatting alone.
      - name: Install ktlint
        run: |
          curl -sSL \
            -o "$RUNNER_TEMP/ktlint" \
            https://github.com/pinterest/ktlint/releases/download/1.7.1/ktlint
          chmod +x "$RUNNER_TEMP/ktlint"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Kotlin bindings drift check
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cargo build -p fp-backends-mobile --features uniffi
          cargo run -p uniffi-bindgen -- generate \
            --library target/debug/libfp_backends_mobile.so \
            --language kotlin \
            --out-dir "$tmp"
          # uniffi-bindgen writes into a package-path subtree
          # (<tmp>/org/fauste/player/rust/); committed bindings live flat.
          gen_dir="$(dirname "$(find "$tmp" -name '*.kt' -print -quit)")"
          diff -ru "$gen_dir" crates-mobile/fp-backends-mobile/bindings/kotlin

      - uses: gradle/actions/wrapper-validation@v3
