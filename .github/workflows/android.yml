name: Android

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Path deps resolve ../fauste-player relative to this repo's checkout;
      # actions/checkout@v4 refuses paths outside $GITHUB_WORKSPACE, but the
      # workspace manifests declare the desktop crates as ../fauste-player
      # (a sibling, mirroring the local layout). Check out inside the
      # workspace, then symlink it into the sibling slot the manifests expect.
      # ref rides the desktop tip — pin a SHA here if CI should become
      # flaky-coupled to desktop changes.
      - name: Check out the desktop repo (path dependencies)
        uses: actions/checkout@v4
        with:
          repository: sanchezfauste/fauste-player
          ref: master
          path: fauste-player
      - name: Expose the desktop checkout at the sibling path the manifests expect
        run: ln -s "$GITHUB_WORKSPACE/fauste-player" "$(dirname "$GITHUB_WORKSPACE")/fauste-player"

      # temurin 21 — pinned on runners as the boring, cheapest, fully-supported
      # LTS for Gradle 9.3.1 / AGP 8.13.2 (Gradle 9.1+ also supports JDK 25;
      # 21 is a stability choice, not a support limit).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest has the Android SDK at $ANDROID_HOME but does NOT put
      # cmdline-tools on PATH; call sdkmanager by its full path. The image no
      # longer ships this NDK — the step installs the pinned one.
      - name: Android SDK components
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null
          "$SDKMGR" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Android Rust targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Gradle build and tests
        # :composeApp:testDebugUnitTest runs the Robolectric-based Compose
        # UI tests on the host JVM (no emulator needed) — see
        # composeApp/build.gradle.kts's androidUnitTest note.
        #
        # assembleRelease + bundleRelease (Phase 5, Task 6 — the judgment,
        # documented): the release lane rides the EXISTING android job, no
        # separate workflow — R8/proguard-rule regressions are a
        # per-change risk (any new reflective dependency needs a keep
        # rule), and here they break CI instead of the maintainer's local
        # signing step. Cost stays low because the release tasks share
        # everything expensive with the lane's earlier work: buildRust's
        # staged cdylibs, and one minifyReleaseWithR8 pass that both the
        # APK and the AAB consume (bundleRelease after assembleRelease adds
        # only bundle packaging). NO signing properties are set — CI builds
        # the honest UNSIGNED release artifacts (assembleRelease with no
        # RELEASE_* properties is green by design; see
        # composeApp/build.gradle.kts and docs/release/signing.md); CI
        # proves R8 + packaging, never identity, so no secrets exist to
        # leak.
        run: ./gradlew buildRust :fp-app-mobile-shared:test :composeApp:assembleDebug :composeApp:testDebugUnitTest :composeApp:assembleRelease :composeApp:bundleRelease

      # Bindings drift check: regenerate the Kotlin bindings into a temp dir
      # and diff against the committed files. ktlint is pinned to 1.7.1 and
      # installed BEFORE regenerating because uniffi-bindgen formats its
      # output by shelling out to `ktlint -F`; the committed bindings are the
      # formatted output, so CI must regenerate under the same tooling state
      # or it would fail on formatting alone.
      - name: Install ktlint
        run: |
          curl -sSL \
            -o "$RUNNER_TEMP/ktlint" \
            https://github.com/pinterest/ktlint/releases/download/1.7.1/ktlint
          chmod +x "$RUNNER_TEMP/ktlint"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Kotlin bindings drift check
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cargo build -p fp-backends-mobile --features uniffi
          cargo run -p uniffi-bindgen -- generate \
            --library target/debug/libfp_backends_mobile.so \
            --language kotlin \
            --out-dir "$tmp"
          # uniffi-bindgen writes into a package-path subtree
          # (<tmp>/org/fauste/player/rust/); committed bindings live flat.
          gen_dir="$(dirname "$(find "$tmp" -name '*.kt' -print -quit)")"
          diff -ru "$gen_dir" crates-mobile/fp-backends-mobile/bindings/kotlin

      - uses: gradle/actions/wrapper-validation@v3
