name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Path deps resolve ../fauste-player relative to this repo's checkout;
      # checkout@v4 accepts paths outside $GITHUB_WORKSPACE. ref rides the
      # desktop tip — pin a SHA here if CI should become flaky-coupled to
      # desktop changes.
      - name: Check out the desktop repo (path dependencies)
        uses: actions/checkout@v4
        with:
          repository: sanchezfauste/fauste-player
          ref: master
          path: ../fauste-player

      # Installs exactly the toolchain pinned in rust-toolchain.toml (1.98.1)
      # with the rustfmt/clippy components it requests.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (uniffi feature)
        run: cargo clippy --workspace --all-targets --features uniffi -- -D warnings

      - name: Test (host)
        run: cargo test --workspace

      - name: Test (uniffi feature)
        run: cargo test --workspace --features uniffi

      - name: Dependency audit
        run: cargo deny check
