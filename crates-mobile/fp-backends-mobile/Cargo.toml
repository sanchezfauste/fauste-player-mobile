[package]
name = "fp-backends-mobile"
description = "Mobile audio output backends (AAudio, AudioEngine) behind the desktop AudioBackend trait"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[features]
uniffi = ["dep:uniffi"]

[dependencies]
fp-analysis.workspace = true
fp-backends.workspace = true
fp-engine.workspace = true
fp-model.workspace = true
fp-remote.workspace = true
fp-store.workspace = true
rtrb.workspace = true
thiserror.workspace = true
tracing.workspace = true
uniffi = { version = "0.28", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
aaudio-sys = "0.1"

# The conformance and engine-hook smoke tests: compiled for Android, where
# they run, and on the host, where they reduce to zero tests. fp-decode backs
# the decode smoke, which runs ON both (host and Android, no cfg gate).
[dev-dependencies]
fp-decode.workspace = true
fp-engine.workspace = true
fp-model.workspace = true

# Own lints table instead of `[lints] workspace = true`: the workspace forbids
# unsafe_code, which cannot be relaxed locally. This crate needs one sanctioned
# FFI boundary (src/aaudio_backend.rs on Android), so it carries deny-level
# copies of the workspace lints (plus clippy::indexing_slicing) and allows
# unsafe code in that one module on Android only.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
